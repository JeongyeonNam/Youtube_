name: Cloud browser check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check Studio access without credentials
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('https://studio.youtube.com/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(5000);
            const url = new URL(page.url());
            console.log('Browser started successfully');
            console.log('Destination host:', url.hostname);
            console.log('Google login required:', url.hostname === 'accounts.google.com');
            console.log('No credentials were supplied. Authenticated channel metrics have not been tested.');
            await browser.close();
          })().catch(e => { console.error(e.message); process.exit(1); });
          JS
